# Submission for awesome-dsh-plugin/awesome-dsh-plugin
#
# The whole submission is one file at data/plugins/<owner>__<repo>.yml.
# The two READMEs are generated from those files and must not be hand-edited.
# A description containing ": " must be quoted or YAML reads it as a nested key.
